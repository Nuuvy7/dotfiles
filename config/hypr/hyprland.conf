# Hyprland configuration
# Converted from lua config (serpantinum format) to standard hyprland.conf
# Original: ~/.config/hypr/config/*.lua

########################################################################################
# VARIABLES
########################################################################################

$mainMod = SUPER
$terminal = kitty

########################################################################################
# ENVIRONMENT
########################################################################################

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

########################################################################################
# MONITORS
########################################################################################

monitor = ,preferred,auto,1.0

########################################################################################
# AUTOSTART
########################################################################################

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = systemctl --user start easyeffects
# Fallback: kalau systemd user service serpantinum belum jalan, start manual.
exec-once = serpantinumd start
exec-once = kitty -e fetch

########################################################################################
# GENERAL
########################################################################################

general {
    border_size = 0
    gaps_in = 4
    gaps_out = 6
    float_gaps = 6
    resize_on_border = true
    extend_border_grab_area = 30
}

########################################################################################
# DECORATION
########################################################################################

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = false
    }
}

########################################################################################
# INPUT
########################################################################################

input {
    kb_layout = us
    kb_options = grp:alt_shift_toggle
    accel_profile = flat

    touchpad {
        natural_scroll = true
        disable_while_typing = false
    }
}

########################################################################################
# MISC
########################################################################################

misc {
    focus_on_activate = false
    font_family = JetBrains Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

########################################################################################
# ANIMATIONS
########################################################################################

# animation {
#     enabled = true
# }

bezier = myBezier, 0.05, 0.9, 0.1, 1.05

animation = windows, 1, 5, myBezier, popin 80%
animation = windowsOut, 1, 5, myBezier, popin 80%
animation = layers, 1, 5, myBezier, fade
animation = layersIn, 1, 5, myBezier, fade
animation = layersOut, 1, 5, myBezier, fade
animation = fade, 1, 5, myBezier
animation = workspaces, 1, 5, myBezier, slide
animation = specialWorkspaceIn, 1, 5, myBezier, fade
animation = specialWorkspaceOut, 1, 5, myBezier, fade

########################################################################################
# GESTURES
########################################################################################

gesture = 3, horizontal, workspace

########################################################################################
# BINDINGS
########################################################################################

# Mouse
bind = $mainMod, mouse:272, movewindow
# bind = $mainMod, mouse:273, resizewindow

# Resize window (shift + arrows)
bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50

# Move window (ctrl + arrows)
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# Focus (arrows)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, togglefloating

# Brightness (XF86 keys)
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+

# Screenshot (Print key variants) — serpantinum yang handle (di bawah, bagian Serpantinum).
# Keybind grim lama dihapus biar nggak konflik.

# Lock screen
bind = ,XF86PowerOff, exec, hyprlock
bind = $mainMod, L, exec, hyprlock

# Media controls
bind = $mainMod, SPACE, exec, playerctl play-pause
bind = ,XF86AudioPause, exec, playerctl play-pause
bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioPrev, exec, playerctl previous
bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# Apps
bind = $mainMod, Z, exec, zen-beta
bind = $mainMod, E, exec, kitty -e yazi
bind = $mainMod, T, exec, $terminal
bind = $mainMod, O, exec, zed

# ===== Serpantinum shell integration =====
# Launcher / panels (dari keybinds.lua asli, dikonversi ke format .conf
# karena NixOS standalone tidak punya plugin hyprlua).
bind = $mainMod, R, exec, serpantinum reload
bind = $mainMod, C, exec, serpantinum msg toggle clipboard
bind = $mainMod, D, exec, serpantinum msg toggle launcher
bind = $mainMod, M, exec, serpantinum msg toggle music
bind = $mainMod, B, exec, serpantinum msg toggle system
bind = $mainMod, W, exec, serpantinum msg toggle wallpaper
bind = $mainMod, S, exec, serpantinum msg toggle calendar
bind = $mainMod, N, exec, serpantinum msg toggle network
bind = $mainMod, V, exec, serpantinum msg toggle volume
bind = $mainMod, H, exec, serpantinum msg toggle guide
bind = $mainMod, A, exec, serpantinum msg toggle autohide

# Serpantinum: screenshot, lock, brightness, volume (ganti versi lama)
bind = ,Print, exec, serpantinum screenshot
bind = SHIFT,Print, exec, serpantinum screenshot --edit
bind = $mainMod,Print, exec, serpantinum screenshot --full
bind = $mainMod SHIFT,Print, exec, serpantinum screenshot --full --edit
bind = ,XF86PowerOff, exec, serpantinum lock
bind = $mainMod, L, exec, serpantinum lock
bindel = ,XF86MonBrightnessDown, exec, serpantinum brightness lower
bindel = ,XF86MonBrightnessUp, exec, serpantinum brightness raise
bind = ,XF86AudioMicMute, exec, serpantinum volume mic-toggle
bind = ,XF86AudioMute, exec, serpantinum volume mute-toggle
bindel = ,XF86AudioLowerVolume, exec, serpantinum volume lower
bindel = ,XF86AudioRaiseVolume, exec, serpantinum volume raise

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
